cat << 'EOF' > pyproject.toml
[project]
name = "brain-mri-segmentation"
version = "0.1.0"
description = "Brain MRI Segmentation with U-Net, ResUNet, and SwinUNETR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-image>=0.22.0",
    "medpy>=0.4.0",
    "Pillow>=10.0.0",
    "scipy",
    "tensorboard>=2.15.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "kagglehub",
]

[tool.uv]
package = false
system-site-packages = true
EOF
