[project]
name = "brain-mri-segmentation"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy<2.0",
    "scikit-image>=0.22.0",
    "medpy>=0.4.0",
    "Pillow>=10.0.0",
    "scipy",
    "tensorboard>=2.15.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "kagglehub",
    "scikit-image",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=2.3"]
# ONNX export (torch.export-based exporter) and ONNX Runtime inference; for GPU inference replace
# onnxruntime with onnxruntime-gpu (the two packages must not be installed together)
onnx = ["onnx>=1.23", "onnxscript>=0.7", "onnxruntime>=1.23"]
# TensorRT 11.3 runtime and builder (CUDA 13 wheels, matching the default PyTorch wheels; use tensorrt-cu12 with a
# CUDA 12 build of PyTorch)
tensorrt = ["tensorrt>=11.3,<12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
explicit_package_bases = true
